name: Release (tag)

# main で apps/mcp・apps/extension の package.json の版が変わったら、その版のタグを付けて公開のワークフローを起動する。
# GITHUB_TOKEN で push したタグでは push トリガーが起動しないため、公開のワークフローは workflow_dispatch でタグを指定して起動する。
on:
  push:
    branches: [main]
    paths:
      - apps/mcp/package.json
      - apps/extension/package.json

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # タグを push する
      actions: write # 公開のワークフローを起動する
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 版が変わった対象にタグを付け、公開を起動する
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for target in mcp extension; do
            pkg="apps/$target/package.json"
            version=$(node -p "require('./$pkg').version")
            previous=$(git show "$BEFORE:$pkg" 2>/dev/null | jq -r .version || true)
            if [ "$version" = "$previous" ]; then
              continue
            fi
            tag="$target-v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::notice::タグ $tag は既にあるので飛ばします"
              continue
            fi
            git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
            git push origin "$tag"
            gh workflow run "release-$target.yml" --ref "$tag"
            echo "::notice::$tag を付け、release-$target.yml を起動しました"
          done
