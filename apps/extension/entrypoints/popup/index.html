<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Harie</title>
    <style>
      body { margin: 0; padding: 12px; width: 248px; font: 13px/1.5 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #2b2620; }
      h1 { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 0 0 10px; }
      h1 img { width: 20px; height: 20px; }
      button { font: inherit; color: inherit; cursor: pointer; }
      .timer { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; cursor: pointer; font-size: 12px; color: #5c5348; }
      .timer input { appearance: none; position: relative; flex: none; width: 28px; height: 16px; margin: 0; border-radius: 999px; background: #e6dcc6; cursor: pointer; transition: background 0.15s; }
      .timer input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
      .timer input:checked { background: #b0861a; }
      .timer input:checked::after { transform: translateX(12px); }
      .timer input:focus-visible { outline: 2px solid #b0861a; outline-offset: 2px; }
      .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .modes button { word-break: auto-phrase; text-wrap: balance; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border: 1px solid #e6dcc6; border-radius: 8px; background: #fff; font-size: 12px; line-height: 1.3; }
      .modes button:hover { border-color: #b0861a; background: #fbf6e9; }
      .modes svg { width: 24px; height: 24px; color: #8a6a12; }
      .pending { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 8px 0 0; padding: 6px 8px; border-radius: 6px; background: #fbf6e9; }
      .pending[hidden] { display: none; }
      .pending button { padding: 2px 10px; border: 1px solid #e6dcc6; border-radius: 6px; background: #fff; }
      [role="alert"] { color: #b42318; margin: 8px 0 0; }
      .links { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 10px 0 0; padding-top: 8px; border-top: 1px solid #e6dcc6; }
      .links button { padding: 0; border: 0; background: none; color: #8a6a12; font-size: 12px; text-align: left; }
      .links button:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <h1><img src="/icon/32.png" alt="" /><span>Harie</span></h1>
    <div class="modes">
      <button type="button" data-mode="visible">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /></svg>
        <span data-message="visible">見えている範囲</span>
      </button>
      <button type="button" data-mode="region">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1" /></svg>
        <span data-message="region">範囲を選ぶ</span>
      </button>
      <button type="button" data-mode="element">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><rect x="7" y="9" width="10" height="6" rx="1" fill="currentColor" stroke="none" /></svg>
        <span data-message="element">要素を選ぶ</span>
      </button>
    </div>
    <label class="timer"><input type="checkbox" /><span data-message="timerLabel">5 秒待ってから撮る</span></label>
    <div class="pending" role="status" hidden>
      <span></span>
      <button type="button" data-message="timerCancel">やめる</button>
    </div>
    <p role="alert" hidden></p>
    <div class="links">
      <button type="button" class="blank" data-message="blank">空のエディタを開く</button>
      <button type="button" class="settings" data-message="settings">設定（サイト上の画像ガイド）</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
