name: Release @harie/mcp

# `mcp-v<version>` のタグを push すると、検証してから npm に公開し、GitHub Release を作る。
# npm への認証は Trusted Publishing（OIDC）。長期トークンはシークレットに置かない。
# 続けて公式の MCP Registry にも登録する（GitHub OIDC。シークレット不要）。
# npm 側の設定: @harie/mcp → Settings → Trusted Publisher に
#   GitHub Actions / hosshan / harie / release-mcp.yml / 環境 npm を登録する。
on:
  push:
    tags: ["mcp-v*"]
  # release-tag.yml がタグを指定して起動する（Actions の画面から既存のタグを選んで再実行もできる）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      # MCP Registry への登録に使う公式 CLI。上げるときはリリースのタグを確かめてから書き換える
      MCP_PUBLISHER_VERSION: v1.8.1
    permissions:
      contents: write # GitHub Release の作成
      id-token: write # npm Trusted Publishing（OIDC）と provenance、MCP Registry の GitHub OIDC 認証
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing には npm 11.5.1 以上が要る（Node 22 同梱の npm は 10 系）
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile

      - name: タグと package.json の版が一致するか確かめる
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::タグを指定して実行してください（今の ref: $GITHUB_REF_NAME）"
            exit 1
          fi
          version=$(node -p "require('./apps/mcp/package.json').version")
          tag="${GITHUB_REF_NAME#mcp-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::タグ ($GITHUB_REF_NAME) と apps/mcp/package.json の version ($version) が一致しません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@harie/mcp@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@harie/mcp@$version は公開済みなので npm への公開は飛ばします"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm check

      # pnpm pack で workspace: 指定を実際の版に置き換えた tarball を作り、npm で公開する
      - name: パッケージを作る
        run: |
          pnpm --filter @harie/mcp build
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @harie/mcp pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - name: npm に公開する
        if: steps.version.outputs.published == 'false'
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --access public --provenance

      # 公式の MCP Registry（registry.modelcontextprotocol.io）に io.github.hosshan/harie として登録する。
      # npm の package.json の mcpName で所有を確かめるので、npm への公開の後に行う。
      - name: MCP Registry に登録済みか確かめる
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(jq -r .name apps/mcp/server.json)
          url="https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$VERSION"
          if curl -fsS -o /dev/null "$url"; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$VERSION は MCP Registry に登録済みなので飛ばします"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cosign を入れる（mcp-publisher の署名確認に使う）
        if: steps.registry.outputs.registered == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: MCP Registry に登録する
        if: steps.registry.outputs.registered == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: apps/mcp
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl -fsSL -o "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/$archive"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
          # server.json の版は公開する package.json の版に合わせる
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json
          # 公開した直後の版は npm の API にすぐ出ず、Registry の検証が 404 で落ちるので、出るまで待つ（最大 5 分）
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/@harie%2fmcp/$VERSION"; then
              break
            fi
            if [ "$i" = 20 ]; then
              echo "::error::@harie/mcp@$VERSION が npm に出てこないため Registry に登録できません"
              exit 1
            fi
            echo "@harie/mcp@$VERSION が npm に出るのを待っています（$i/20）"
            sleep 15
          done
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

      - name: GitHub Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME は作成済み"
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pack/*.tgz \
              --title "@harie/mcp ${{ steps.version.outputs.version }}" --generate-notes
          fi
