name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は止める（main は 1 件ずつ最後まで回す）
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # PR の拡張・Web をローカルにビルドせず試せるように、ビルド結果を残す（Actions の実行ページから取得）
      - uses: actions/upload-artifact@v4
        with:
          name: harie-extension-chrome-mv3
          path: apps/extension/.output/chrome-mv3/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: harie-web-dist
          path: apps/web/dist/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    # ブラウザの依存パッケージ（apt）の取得が止まることがあるため、既定の 6 時間待たずに打ち切る
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @harie/web exec playwright install --with-deps chromium
      - run: pnpm e2e
