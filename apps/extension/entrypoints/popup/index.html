<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Harie でキャプチャ</title>
    <style>
      body { margin: 0; padding: 12px; width: 240px; font: 13px/1.5 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #2b2620; }
      h1 { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 0 0 8px; }
      h1 img { width: 20px; height: 20px; }
      button { display: block; width: 100%; margin: 0 0 6px; padding: 8px 10px; border: 1px solid #e6dcc6; border-radius: 6px; background: #fff; font: inherit; text-align: left; cursor: pointer; }
      button:hover { border-color: #b0861a; background: #fbf6e9; }
      .muted { color: #7a7064; font-size: 12px; margin: 6px 0 0; }
      [role="alert"] { color: #b42318; margin: 6px 0 0; }
      h2 { font-size: 12px; margin: 12px 0 4px; padding-top: 10px; border-top: 1px solid #e6dcc6; }
      label { display: flex; align-items: flex-start; gap: 6px; margin: 0 0 4px; cursor: pointer; }
      label input { margin: 3px 0 0; accent-color: #b0861a; }
      fieldset { margin: 8px 0 0; padding: 0; border: 0; }
      legend { margin: 0 0 4px; padding: 0; color: #7a7064; }
      .sites { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
      .sites li { display: flex; align-items: center; gap: 2px; padding: 1px 2px 1px 8px; border: 1px solid #e6dcc6; border-radius: 999px; background: #fbf6e9; font-size: 12px; }
      .sites button { display: inline-flex; width: 20px; height: 20px; margin: 0; padding: 0; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: #7a7064; font-size: 14px; line-height: 1; }
      .sites button:hover { background: #e6dcc6; color: #2b2620; }
      .sites-all { margin: 0 0 4px; }
      .add-site { display: flex; gap: 4px; }
      .add-site input { flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid #e6dcc6; border-radius: 6px; font: inherit; }
      .add-site button { display: inline-block; width: auto; margin: 0; padding: 4px 10px; text-align: center; }
      .site-error { margin: 4px 0 0; color: #b42318; font-size: 12px; }
      .site-error:empty { display: none; }
    </style>
  </head>
  <body>
    <h1><img src="/icon/32.png" alt="" /><span data-message="popupTitle">Harie でキャプチャ</span></h1>
    <button type="button" data-mode="visible" data-message="visible">見えている範囲</button>
    <button type="button" data-mode="region" data-message="region">範囲を選ぶ</button>
    <button type="button" data-mode="element" data-message="element">要素を選ぶ</button>
    <p class="muted" data-message="popupNote">撮った画像は Harie のエディタで開きます。画像とページの情報は、AI を使うまでこの端末から出ません。</p>
    <p role="alert" hidden></p>
    <h2 data-message="pageTitle">ページ上の Harie 画像</h2>
    <label><input type="checkbox" data-feature="edit" /><span data-message="pageEdit">画像に編集ボタンを出す</span></label>
    <label><input type="checkbox" data-feature="copy" /><span data-message="pageCopy">画像に説明文のコピーボタンを出す</span></label>
    <fieldset>
      <legend data-message="pageSites">ボタンを出すサイト</legend>
      <ul class="sites"></ul>
      <p class="muted sites-all" data-message="pageSitesAll">指定がなければ、すべてのサイトで出します。</p>
      <form class="add-site">
        <input type="text" name="site" autocomplete="off" spellcheck="false" />
        <button type="submit" data-message="pageSiteAdd">追加</button>
      </form>
      <p class="site-error" role="status"></p>
    </fieldset>
    <p class="muted" data-message="pageNote"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
