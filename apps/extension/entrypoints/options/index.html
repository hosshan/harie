<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>画像ガイドの表示設定</title>
    <style>
      body { margin: 0; padding: 32px 16px; font: 14px/1.6 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #2b2620; background: #faf7f0; }
      main { max-width: 560px; margin: 0 auto; }
      h1 { display: flex; align-items: center; gap: 8px; font-size: 18px; margin: 0 0 20px; }
      h1 img { width: 24px; height: 24px; }
      section { margin: 0 0 16px; padding: 16px; border: 1px solid #e6dcc6; border-radius: 10px; background: #fff; }
      h2 { font-size: 14px; margin: 0 0 8px; }
      .muted { color: #7a7064; font-size: 13px; margin: 8px 0 0; }
      label { display: flex; align-items: flex-start; gap: 6px; margin: 0 0 4px; cursor: pointer; }
      label input { margin: 4px 0 0; accent-color: #b0861a; }
      fieldset { margin: 12px 0 0; padding: 0; border: 0; }
      legend { margin: 0 0 4px; padding: 0; color: #7a7064; }
      .sites { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
      .sites li { display: flex; align-items: center; gap: 2px; padding: 1px 2px 1px 8px; border: 1px solid #e6dcc6; border-radius: 999px; background: #fbf6e9; font-size: 13px; }
      .sites button { display: inline-flex; width: 22px; height: 22px; margin: 0; padding: 0; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: #7a7064; font-size: 15px; line-height: 1; cursor: pointer; }
      .sites button:hover { background: #e6dcc6; color: #2b2620; }
      .sites-all { margin: 0 0 6px; }
      .add-site { display: flex; gap: 6px; max-width: 360px; }
      .add-site input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid #e6dcc6; border-radius: 6px; font: inherit; }
      .add-site button { padding: 6px 14px; border: 1px solid #e6dcc6; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
      .add-site button:hover { border-color: #b0861a; background: #fbf6e9; }
      .site-error { margin: 4px 0 0; color: #b42318; font-size: 13px; }
      .site-error:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1><img src="/icon/32.png" alt="" /><span data-message="settings">画像ガイドの表示設定</span></h1>
      <section>
        <h2 data-message="pageTitle">サイト上の画像ガイド</h2>
        <label><input type="checkbox" data-feature="edit" disabled /><span data-message="pageEdit">画像に編集ボタンを表示</span></label>
        <label><input type="checkbox" data-feature="copy" disabled /><span data-message="pageCopy">画像に文章のコピーボタンを表示</span></label>
        <fieldset>
          <legend data-message="pageSites">対象サイト</legend>
          <ul class="sites"></ul>
          <p class="muted sites-all" data-message="pageSitesAll">指定がなければ、すべてのサイトを対象にします。</p>
          <form class="add-site">
            <input type="text" name="site" autocomplete="off" spellcheck="false" />
            <button type="submit" data-message="pageSiteAdd">追加</button>
          </form>
          <p class="site-error" role="status"></p>
        </fieldset>
        <p class="muted" data-message="pageNote"></p>
      </section>
      <p class="muted" data-message="popupNote">AIを利用しない場合、画像やページ情報は端末内でのみ処理されます。</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
